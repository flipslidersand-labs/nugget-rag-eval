name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  markdownlint:
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes markdownlint-cli@0.49.1 --config .markdownlint.json "**/*.md" --ignore node_modules --ignore .venv

  test:
    uses: flipslidersand-labs/qa-workflows/.github/workflows/python-test.yml@60de103cd4a30463fb4bfcc220c7df9b0696881b  # main
    with:
      coverage-threshold: 90

  eval-regression:
    needs: test
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Eval regression smoke (BM25-only, fixture data)
        run: python eval/check_regression.py --chunks tests/fixtures/chunks_test.json --gold tests/fixtures/gold_test.json --threshold 0.95
      - name: Eval regression gate (BM25-only, real data)
        run: python eval/check_regression.py --chunks data/chunks_large.json --gold eval/gold_set.json --threshold 0.95

  gitleaks:
    permissions:
      contents: read
    uses: flipslidersand-labs/qa-workflows/.github/workflows/gitleaks.yml@eed33087a24f58b734711cdddd2d991b7ae5f7ed  # main
