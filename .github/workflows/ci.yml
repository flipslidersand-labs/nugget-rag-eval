name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  markdownlint:
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"  # markdownlint-cli@0.49.1 は engines node >=22
      - run: npx --yes markdownlint-cli@0.49.1 --config .markdownlint.json "**/*.md" --ignore node_modules --ignore .venv

  test:
    permissions:
      contents: read
    uses: flipslidersand-labs/qa-workflows/.github/workflows/python-test.yml@60de103cd4a30463fb4bfcc220c7df9b0696881b  # main
    with:
      coverage-threshold: 90

  eval-regression:
    needs: test
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Eval regression smoke (BM25-only, fixture data)
        run: python eval/check_regression.py --chunks tests/fixtures/chunks_test.json --gold tests/fixtures/gold_test.json --threshold 0.95
      - name: Eval regression gate (BM25-only, real data)
        run: python eval/check_regression.py --chunks data/chunks_large.json --gold eval/gold_set.json --threshold 0.95 --baseline eval/baseline_gold.json --max-drop 0.0

  gitleaks:
    permissions:
      contents: read
    uses: flipslidersand-labs/qa-workflows/.github/workflows/gitleaks.yml@eed33087a24f58b734711cdddd2d991b7ae5f7ed  # main
