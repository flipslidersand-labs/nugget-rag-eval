[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nugget-rag-eval"
version = "2.0.0"
description = "CoinRAG-inspired nugget retrieval evaluation harness"
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["nugget_rag", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["nugget_rag", "eval"]
omit = ["scripts/*"]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["E", "F", "I", "UP", "PLW1514"]
ignore = ["E501"]
